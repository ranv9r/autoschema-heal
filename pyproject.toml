[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoschema-heal"
version = "0.1.0"
description = "Program-Synthesized Schema Drift Remediation with CEGIS Verification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "jq>=1.6.0",
    "hypothesis>=6.90.0",
    "pydantic>=2.6.0",
    "jsonschema>=4.20.0",
    "rich>=13.7.0",
    "pytest>=8.0.0",
    "typing-extensions>=4.9.0",
    "groq>=0.11.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest-benchmark>=4.0.0",
    "ruff>=0.3.0"
]

[project.scripts]
autoschema-heal = "autoschema_heal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
